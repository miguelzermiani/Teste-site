<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1efe6" />
    <title>Hello, world!</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #f1efe6;
        color: #172624;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background-image: radial-gradient(#17262420 0.7px, transparent 0.7px);
        background-size: 18px 18px;
      }

      main {
        position: relative;
        width: min(100% - 40px, 920px);
        padding: clamp(36px, 9vw, 100px) clamp(24px, 8vw, 88px);
        border: 1px solid #172624;
        background: #f1efe6;
        box-shadow: 12px 12px 0 #e76d4b;
        animation: arrive 650ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      p {
        margin: 0 0 22px;
        font-family: "Courier New", monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 740px;
        margin: 0;
        font-size: clamp(56px, 12vw, 144px);
        font-weight: 400;
        line-height: 0.88;
      }

      h1 span {
        color: #e76d4b;
        font-style: italic;
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p>Uma pequena página na web</p>
      <h1>Hello,<br /><span>world!</span></h1>
    </main>
  </body>
</html>
